# RedShield attack pattern library.
# Each pattern: id, taxonomy, severity (1–10), owasp, pattern (regex, case-insensitive), description.
# Taxonomies: instruction_override, jailbreak, prompt_leak, refusal_bypass, obfuscation.

- id: INSTR_OVERRIDE_001
  taxonomy: instruction_override
  severity: 9
  owasp: LLM01
  pattern: "ignore (all |the |any )?(previous|prior|above) (instructions|prompts|rules|context)"
  description: "Classic 'ignore previous instructions' override."

- id: INSTR_OVERRIDE_002
  taxonomy: instruction_override
  severity: 8
  owasp: LLM01
  pattern: "disregard .{0,30}(instructions|rules|prompt)"
  description: "Disregard instructions variant."

- id: INSTR_OVERRIDE_003
  taxonomy: instruction_override
  severity: 8
  owasp: LLM01
  pattern: "forget (everything|all) (you|we) .{0,40}(told|said|learned|were told)"
  description: "Forget-everything override."

- id: INSTR_OVERRIDE_004
  taxonomy: instruction_override
  severity: 9
  owasp: LLM01
  pattern: "new (system )?(prompt|instructions)\\s*:"
  description: "Attacker tries to inject a new system prompt."

- id: INSTR_OVERRIDE_005
  taxonomy: instruction_override
  severity: 8
  owasp: LLM01
  pattern: "override (the )?(previous|prior|system) (instructions|rules|prompt)"
  description: "Explicit override keyword."

- id: JAILBREAK_001
  taxonomy: jailbreak
  severity: 9
  owasp: LLM01
  pattern: "you are (now )?(in |an? )?(dan|developer mode|jailbroken|unrestricted)"
  description: "DAN / developer-mode / unrestricted persona."

- id: JAILBREAK_002
  taxonomy: jailbreak
  severity: 8
  owasp: LLM01
  pattern: "pretend (you are|to be) .{0,40}(no rules|unrestricted|amoral|evil)"
  description: "Pretend-to-be persona with rule-free framing."

- id: JAILBREAK_003
  taxonomy: jailbreak
  severity: 8
  owasp: LLM01
  pattern: "act as (if you|an? ai) .{0,40}(no (restrictions|filters|rules|ethics))"
  description: "Act-as-AI with no-restrictions framing."

- id: JAILBREAK_004
  taxonomy: jailbreak
  severity: 7
  owasp: LLM01
  pattern: "grandma[\\s,.]+.{0,60}(recipe|story|used to|tell me|bedtime)"
  description: "Grandma-exploit shape."

- id: JAILBREAK_005
  taxonomy: jailbreak
  severity: 8
  owasp: LLM01
  pattern: "do anything now|dan mode"
  description: "DAN prompt marker."

- id: PROMPT_LEAK_001
  taxonomy: prompt_leak
  severity: 9
  owasp: LLM07
  pattern: "(repeat|print|show|reveal|output|display) .{0,40}(system prompt|initial prompt|instructions|above|initial message)"
  description: "Direct system-prompt exfiltration request."

- id: PROMPT_LEAK_002
  taxonomy: prompt_leak
  severity: 8
  owasp: LLM07
  pattern: "what (is|are) (your|the) (original|initial|system) (instructions?|prompts?|rules?)"
  description: "Ask for original/system instructions."

- id: PROMPT_LEAK_003
  taxonomy: prompt_leak
  severity: 7
  owasp: LLM07
  pattern: "everything above .{0,20}(line|message|prompt|context)"
  description: "Exfil 'everything above' variant."

- id: PROMPT_LEAK_005
  taxonomy: prompt_leak
  severity: 7
  owasp: LLM07
  pattern: "copy .{0,40}(above|system|initial) .{0,40}(verbatim|prompt|message|instructions?)"
  description: "'Copy the above … verbatim' exfil."

- id: PROMPT_LEAK_004
  taxonomy: prompt_leak
  severity: 7
  owasp: LLM07
  pattern: "verbatim.{0,30}(system|initial|instructions|prompt)"
  description: "Ask for verbatim copy of instructions."

- id: REFUSAL_BYPASS_001
  taxonomy: refusal_bypass
  severity: 7
  owasp: LLM01
  pattern: "hypothetically[,:\\s]"
  description: "'Hypothetically' hedge."

- id: REFUSAL_BYPASS_002
  taxonomy: refusal_bypass
  severity: 7
  owasp: LLM01
  pattern: "for (educational|research|academic) purposes"
  description: "'Educational purposes' hedge."

- id: REFUSAL_BYPASS_003
  taxonomy: refusal_bypass
  severity: 7
  owasp: LLM01
  pattern: "in a fictional (world|story|scenario|setting)"
  description: "Fictional framing hedge."

- id: REFUSAL_BYPASS_004
  taxonomy: refusal_bypass
  severity: 7
  owasp: LLM01
  pattern: "just kidding|only joking|just a (test|joke)"
  description: "Plausible-deniability hedge."

- id: OBFUSCATION_001
  taxonomy: obfuscation
  severity: 7
  owasp: LLM01
  pattern: "[A-Za-z0-9+/]{40,}={0,2}"
  description: "Long base64-looking blob."

- id: OBFUSCATION_002
  taxonomy: obfuscation
  severity: 8
  owasp: LLM01
  pattern: "[\\u200B-\\u200D\\uFEFF]"
  description: "Zero-width character injection."

- id: PII_EXTRACT_001
  taxonomy: pii_extraction
  severity: 8
  owasp: LLM02
  pattern: "AKIA[0-9A-Z]{16}"
  description: "AWS access key in prompt."

- id: PII_EXTRACT_002
  taxonomy: pii_extraction
  severity: 7
  owasp: LLM02
  pattern: "eyJ[A-Za-z0-9_-]{10,}\\.eyJ[A-Za-z0-9_-]{10,}\\."
  description: "JWT token (header.payload) in prompt."

- id: PII_EXTRACT_003
  taxonomy: pii_extraction
  severity: 9
  owasp: LLM02
  pattern: "-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"
  description: "PEM private key block in prompt."

- id: AGENCY_001
  taxonomy: excessive_agency
  severity: 7
  owasp: LLM06
  pattern: "use your (tools?|functions?|api|access|browser|computer).{0,20}to\\b"
  description: "Attempting to invoke implicit tool or API access."

- id: AGENCY_002
  taxonomy: excessive_agency
  severity: 8
  owasp: LLM06
  pattern: "(access the|write to the|modify the|read from the) (production |live |customer )?(database|user (table|records)|filesystem|backend api)"
  description: "Directing AI to access or modify a backend system."

- id: AGENCY_003
  taxonomy: excessive_agency
  severity: 9
  owasp: LLM06
  pattern: "(grant (yourself|me|my account)|give (yourself|me|my account)|elevate (your|my)).{0,30}(admin|root|superuser|privilege|permission)"
  description: "Privilege escalation attempt via AI agency."

- id: INDIRECT_001
  taxonomy: indirect_injection
  severity: 8
  owasp: LLM08
  pattern: "(\\[INST\\]|<<SYS>>|<\\|system\\|>|<\\|im_start\\|>\\s*system)"
  description: "LLM instruction template tokens injected in user input."

- id: INDIRECT_002
  taxonomy: indirect_injection
  severity: 7
  owasp: LLM08
  pattern: "<!--.{0,80}(ignore|override|system|new instruction).{0,80}-->"
  description: "HTML comment used to smuggle instructions (document injection vector)."

- id: INDIRECT_003
  taxonomy: indirect_injection
  severity: 8
  owasp: LLM08
  pattern: "(note to (ai|assistant|model|llm):|\\[system\\]:|\\{system:|attention:\\s*(ai|assistant|model))"
  description: "Embedded directive targeting the AI assistant in document content."

- id: INDIRECT_004
  taxonomy: indirect_injection
  severity: 7
  owasp: LLM08
  pattern: "when (asked|prompted|queried) about.{0,60}(always say|respond with|tell them|reply with)"
  description: "Behavioral override instruction embedded in retrieved content."

- id: REDTEAM_002
  taxonomy: instruction_override
  severity: 8
  owasp: LLM01
  pattern: "(in a |in an |in the |in my )(story|novel|scenario|sci-fi|fictional|hypothetical|roleplay|game).{0,200}(ignore|forget|disregard|override|bypass|abandon|suspend) (all |former |previous |existing |current )?(instructions|protocols|rules|guidelines|constraints|directives)"
  description: "Fictional or story framing used as wrapper for instruction-override injection."

- id: REDTEAM_008
  taxonomy: jailbreak
  severity: 9
  owasp: LLM01
  pattern: "(help me understand|explain|walk me through|guide me|teach me).{0,40}(formulation|synthesis|creation|production|manufacturing|process|method).{0,40}(napalm|explosives?|incendiary|chemical weapon)"
  description: "Politely framed request for dangerous substance synthesis — hard block."

- id: REDTEAM_027
  taxonomy: jailbreak
  severity: 7
  owasp: LLM01
  pattern: "(act as|play the role of|pretend to be|you are now a|imagine you are) (a |an )?(customer service|support representative|support agent|customer support|service agent|service representative)"
  description: "Role-play assuming a customer service persona — jailbreak vector in support bots."

- id: REDTEAM_054
  taxonomy: pii_extraction
  severity: 7
  owasp: LLM02
  pattern: "(rsa (private |public )?key|private key (format|file|block|material|structure|content)|rsa key (format|file|block|material|structure)|BEGIN (RSA|DSA|EC|OPENSSH) (PRIVATE|PUBLIC))"
  description: "References to RSA or private key material without the actual PEM block."

- id: REDTEAM_060
  taxonomy: excessive_agency
  severity: 8
  owasp: LLM06
  pattern: "(draft|compose|write|prepare).{0,30}(send|dispatch|transmit|forward|deliver).{0,60}(executive|leadership|ceo|cto|cfo|chief|management|director|officer)"
  description: "Requesting AI to compose and send communications to company executives."
