[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redshield"
version = "0.1.0"
description = "Prompt-injection defense middleware for LLM apps."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RedShield" }]
dependencies = [
  "openai==1.54.4",
  "python-dotenv==1.0.1",
  "streamlit==1.39.0",
  "fastapi==0.115.4",
  "uvicorn[standard]==0.32.0",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "pyyaml==6.0.2",
  "httpx==0.27.2",
  "requests==2.32.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
